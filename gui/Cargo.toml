[package]
name = "telegram-downloader"
version = "0.2.0"
edition = "2024"

[dependencies]
grammers-client = "0.12"
grammers-mtsender = "0.12.0"
grammers-session = "0.12.0"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", features = ["native-file-dialog"] }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
